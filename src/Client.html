<script>
(function(){
  'use strict';
  var playerKey='titanx-player-token',hostKey='titanx-host-session',playerToken=localStorage.getItem(playerKey)||'',hostToken=sessionStorage.getItem(hostKey)||'',latest=null,lastCardKey='',lastEvidenceKey='',lastSuspectKey='',lastVotePhase='',lastRevealKey='',pollFailures=0;
  var $=function(id){return document.getElementById(id);};
  function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function call(name,args,done){var runner=google.script.run.withSuccessHandler(function(r){done(r||{ok:false,error:'The server returned no response.'});}).withFailureHandler(function(){done({ok:false,error:'Connection interrupted. Please try again.'});});runner[name].apply(runner,args||[]);}
  function status(id,msg,error){var e=$(id);if(!e)return;e.textContent=msg||'';e.classList.toggle('error',!!error);}
  function busy(button,on){if(button){button.disabled=on;button.dataset.label=button.dataset.label||button.textContent;if(on)button.textContent='Please wait…';else button.textContent=button.dataset.label;}}
  function renderCard(c){if(!c){$('character-card').classList.add('hidden');return;}var killer=c.isKiller?'<div class="private-warning"><b>YOUR SECRET:</b> '+escapeHtml(c.killerInstruction)+'</div>':'';
    $('character-card').innerHTML='<div class="character-role">YOUR CHARACTER · '+escapeHtml(c.role)+'</div><h3>'+escapeHtml(c.name)+'</h3><p>'+escapeHtml(c.description)+'</p>'+killer+block('Your motive',c.motive)+block('Your alibi',c.alibi)+block('Your private secret',c.privateInfo)+block('What you know',c.knows)+block('Your objective',c.objective)+block('Connection',c.relationship)+'<p class="private-warning">KEEP THIS CARD SECRET. Do not share your screen or show your card to other players.</p>';
    $('character-card').classList.remove('hidden');}
  function block(title,value){return '<div class="secret-block"><b>'+escapeHtml(title)+'</b><p>'+escapeHtml(value)+'</p></div>';}
  function renderEvidence(target,list){if(!target)return;if(!list||!list.length){target.innerHTML='<p class="muted">Evidence appears here as the host releases it.</p>';return;}target.innerHTML=list.map(function(x){return '<article class="evidence-card"><span class="clue-meta">ROUND '+String(x.round).padStart(2,'0')+' · EVIDENCE</span><h3>'+escapeHtml(x.title)+'</h3><p>'+escapeHtml(x.description)+'</p></article>';}).join('');}
  function renderSuspects(target,list){if(!target)return;if(!list||!list.length){target.innerHTML='<p class="muted">The guest list appears when players join.</p>';return;}target.innerHTML=list.map(function(x){return '<article class="suspect-card"><span class="clue-meta">'+escapeHtml(x.role||'SUSPECT')+'</span><h3>'+escapeHtml(x.name)+'</h3><p>'+escapeHtml(x.description||'')+'</p><p><b>Distinctive detail:</b> '+escapeHtml(x.mark||'')+'</p><p><b>Motive:</b> '+escapeHtml(x.motive||'')+'</p><p><b>Alibi:</b> '+escapeHtml(x.alibi||'')+'</p></article>';}).join('');}
  function renderVoting(d){var panel=$('vote-panel');if(!panel)return;if(d.phase!=='VOTING_OPEN'||!playerToken){panel.classList.add('hidden');return;}var own=d.character&&d.character.id;var choices=(d.characters||[]).filter(function(c){return c.id!==own;});panel.innerHTML='<h3>Seal your accusation</h3><p class="muted">Your vote is private. '+(d.voteChanges?'You may change it until voting closes.':'You can submit one vote.')+'</p><label for="suspect-choice">Who destroyed Jack?</label><select id="suspect-choice"><option value="">Choose a suspect</option>'+choices.map(function(c){return '<option value="'+escapeHtml(c.id)+'">'+escapeHtml(c.name)+'</option>';}).join('')+'</select><div class="vote-row"><button class="button purple" id="vote-submit">Submit private vote</button><span id="vote-status" class="status"></span></div>';
    panel.classList.remove('hidden');$('vote-submit').onclick=function(){var id=$('suspect-choice').value;if(!id){status('vote-status','Choose a suspect first.',true);return;}busy($('vote-submit'),true);call('submitVote',[playerToken,id],function(r){busy($('vote-submit'),false);status('vote-status',r.ok?r.message:r.error,!r.ok);});};}
  function renderReveal(d){var p=$('reveal-panel');if(!p)return;if(!d.reveal){p.classList.add('hidden');return;}var r=d.reveal,acc=r.winningAccusation?((d.characters||[]).filter(function(c){return c.id===r.winningAccusation;})[0]||{}).name:'Inconclusive — the vote was tied or no ballots were cast.';
    p.innerHTML='<span class="truth-label">THE FINAL REVEAL</span><h2>'+escapeHtml(r.culprit)+'</h2><p><b>Why:</b> '+escapeHtml(r.motive)+'</p><p><b>Timeline:</b> '+escapeHtml(r.timeline)+'</p><p><b>The decisive clue:</b> '+escapeHtml(r.decisive)+'</p><p><b>Red herrings:</b> '+escapeHtml(r.redHerrings)+'</p><p><b>Team accusation:</b> '+escapeHtml(acc)+' · '+(r.correctAccusation?'The team solved it!':'The accusation missed the culprit.')+'</p><p><b>Vote totals:</b> '+voteSummary(r.voteTotals,d.characters)+'</p>';
    p.classList.remove('hidden');}
  function voteSummary(t,characters){var ids=Object.keys(t||{});if(!ids.length)return 'No votes were cast.';return ids.map(function(id){var c=(characters||[]).filter(function(x){return x.id===id;})[0];return escapeHtml(c?c.name:id)+': '+Number(t[id]);}).join(' · ');}
  function renderState(response){if(!response||!response.ok)return;var d=response.data,phase=d.phase||'LOBBY',cardKey=JSON.stringify(d.character||null),evidenceKey=JSON.stringify(d.evidence||[]),suspectKey=JSON.stringify(d.characters||[]),phaseKey=phase+'|'+(d.character&&d.character.id||'');latest=d;$('phase-label').textContent=phase.replace(/_/g,' ');$('player-count').textContent=d.playerCount||0;$('player-limit').textContent=d.playerLimit||12;$('story-text').textContent=d.story||'The celebration was in full swing when the lights flickered. Then came a crash from the conservatory.';$('case-status').textContent=phase.replace(/_/g,' ');if(cardKey!==lastCardKey){renderCard(d.character);lastCardKey=cardKey;}if(evidenceKey!==lastEvidenceKey){renderEvidence($('evidence-grid'),d.evidence);if(window.TITANX_PRESENTATION)renderEvidence($('presentation-evidence'),d.evidence);lastEvidenceKey=evidenceKey;}if(suspectKey!==lastSuspectKey){renderSuspects($('suspect-list'),d.characters);if(window.TITANX_PRESENTATION)renderSuspects($('presentation-suspects'),d.characters);lastSuspectKey=suspectKey;}if(phaseKey!==lastVotePhase){renderVoting(d);lastVotePhase=phaseKey;}
    if(window.TITANX_PRESENTATION){$('presentation').classList.remove('hidden');}
    var revealKey=JSON.stringify(d.reveal||null);if(revealKey!==lastRevealKey){renderReveal(d);lastRevealKey=revealKey;}
    if(d.phase==='VOTING_CLOSED'&&d.voteTotals){$('player-status').textContent='Voting is closed. The host will reveal the result shortly.';}
    }
  function updateTimer(){if(!latest){$('timer').textContent='—';return;}var start=Date.parse(latest.phaseStartedAt||'');var seconds=Number(latest.durationSeconds||180);if(!start){$('timer').textContent='—';return;}var left=Math.max(0,seconds-Math.floor((Date.now()-start)/1000));$('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');}
  function poll(){var hidden=document.hidden,delay=pollFailures?Math.min(30000,5000*Math.pow(2,Math.min(pollFailures,3))):(hidden?18000:7000);call('getPublicGameState',[playerToken],function(r){if(r&&r.ok){pollFailures=0;renderState(r);}else{pollFailures++;}if(hostToken&&!$('host-dashboard').contains(document.activeElement))loadHost();window.setTimeout(poll,delay+Math.floor(Math.random()*700));});}
  $('join-scroll').onclick=function(){$('join').scrollIntoView({behavior:'smooth'});$('display-name').focus();};$('host-scroll').onclick=function(){$('host').scrollIntoView({behavior:'smooth'});$('host-secret').focus();};
  $('join-form').onsubmit=function(ev){ev.preventDefault();var button=$('join-submit');busy(button,true);status('player-status','');call('registerPlayer',[$('display-name').value,playerToken],function(r){busy(button,false);if(!r.ok){status('player-status',r.error,true);return;}playerToken=r.token;localStorage.setItem(playerKey,playerToken);status('player-status','Your character is ready. Keep this card private.');renderCard(r.character);$('display-name').value=r.character&&r.character.name?$('display-name').value:'';poll();});};
  $('host-form').onsubmit=function(ev){ev.preventDefault();var button=$('host-submit');busy(button,true);status('host-status','');call('hostLogin',[$('host-secret').value],function(r){busy(button,false);if(!r.ok){status('host-status',r.error,true);return;}hostToken=r.token;sessionStorage.setItem(hostKey,hostToken);$('host-secret').value='';status('host-status','Host access verified.');loadHost();});};
  function hostAction(fn,args,refresh){call(fn,args,function(r){if(!r.ok){alert(r.error||'Action failed.');return;}if(refresh)loadHost();poll();});}
  function loadHost(){if(!hostToken)return;call('getHostDashboardState',[hostToken],function(r){if(!r.ok){sessionStorage.removeItem(hostKey);hostToken='';status('host-status',r.error,true);return;}renderHost(r.data);});}
  var nextPhase={LOBBY:'INTRODUCTION',INTRODUCTION:'ROUND_ONE',ROUND_ONE:'ROUND_TWO',ROUND_TWO:'ROUND_THREE',ROUND_THREE:'FINAL_DISCUSSION',FINAL_DISCUSSION:'VOTING_OPEN',VOTING_OPEN:'VOTING_CLOSED',VOTING_CLOSED:'REVEAL',REVEAL:'COMPLETED'};
  var phaseLabels={INTRODUCTION:'Start the mystery',ROUND_ONE:'Begin round one',ROUND_TWO:'Begin round two',ROUND_THREE:'Begin round three',FINAL_DISCUSSION:'Start final discussion',VOTING_OPEN:'Open voting',VOTING_CLOSED:'Close voting',REVEAL:'Reveal the truth',COMPLETED:'End the game'};
  function renderHost(d){$('host-login').classList.add('hidden');$('host-dashboard').classList.remove('hidden');var phaseNext=nextPhase[d.phase];var url=d.publicUrl||window.location.href.split('?')[0];
    var controls='<div class="host-actions">';if(d.phase==='LOBBY')controls+='<button class="button primary" data-action="new">Create new game</button><button class="button quiet" data-action="registration">'+(d.registrationOpen?'Close':'Open')+' registration</button>';
    if(phaseNext)controls+='<button class="button purple" data-action="phase">'+escapeHtml(phaseLabels[phaseNext])+'</button>';
    if(['INTRODUCTION','ROUND_ONE','ROUND_TWO','ROUND_THREE','FINAL_DISCUSSION'].indexOf(d.phase)>=0)controls+='<button class="button primary" data-action="clue">Release next clue</button>';
    controls+='<button class="button quiet" data-action="presentation">Open presentation view</button>';if(d.phase!=='LOBBY')controls+='<button class="button quiet" data-action="new">Reset / replay game</button>';controls+='<button class="button quiet" data-action="logout">Log out</button></div>';
    var roster=d.players.length?'<table class="roster"><thead><tr><th>PLAYER</th><th>CHARACTER</th><th>JOINED</th><th></th></tr></thead><tbody>'+d.players.map(function(p){return '<tr><td>'+escapeHtml(p.name)+'</td><td>'+escapeHtml(p.character)+'</td><td>'+escapeHtml(new Date(p.joinedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))+'</td><td><button data-remove="'+escapeHtml(p.id)+'">Remove</button></td></tr>';}).join('')+'</tbody></table>':'<p class="muted">No investigators have joined yet.</p>';
    var clues='<div class="host-note-list">'+(d.evidence||[]).map(function(e){return '<p><b>'+(e.released?'✓':'○')+' '+escapeHtml(e.title)+'</b> · '+escapeHtml(e.hostNote)+'</p>';}).join('')+'</div>';
    var solution=d.solution?'<div class="solution-box"><span class="eyebrow">HOST ONLY · PRIVATE SOLUTION</span><h3>'+escapeHtml(d.solution.culprit)+'</h3><p><b>Motive:</b> '+escapeHtml(d.solution.motive)+'</p><p><b>Timeline:</b> '+escapeHtml(d.solution.timeline)+'</p><p><b>Decisive clue:</b> '+escapeHtml(d.solution.decisive)+'</p><p><b>Red herrings:</b> '+escapeHtml(d.solution.redHerrings)+'</p><p><b>Vote tally:</b> '+(d.voteTotals?voteSummary(d.voteTotals,d.characters||[]):'hidden until voting closes')+'</p></div>':'';
    $('host-dashboard').innerHTML='<div class="host-stats"><div class="stat"><span>GAME PHASE</span><b>'+escapeHtml(d.phase.replace(/_/g,' '))+'</b></div><div class="stat"><span>INVESTIGATORS</span><b>'+d.playerCount+' / '+d.playerLimit+'</b></div><div class="stat"><span>VOTES CAST</span><b>'+(d.phase==='VOTING_OPEN'?d.voteCount+' · choices hidden':d.voteCount)+'</b></div><div class="stat"><span>CHARACTERS</span><b>'+d.characterCount+'</b></div></div><div class="control-row"><label>Player limit<br><select id="limit-select">'+Array.from({length:d.characterCount-3},function(_,i){var n=i+4;return '<option '+(n===d.playerLimit?'selected':'')+'>'+n+'</option>';}).join('')+'</select></label><label>Phase timer<br><select id="duration-select"><option value="120">2 minutes</option><option value="180" selected>3 minutes</option><option value="240">4 minutes</option><option value="300">5 minutes</option></select></label><label><input id="vote-changes" type="checkbox" checked> Allow vote changes</label><button class="button quiet" data-action="save-settings">Save settings</button></div><p class="muted">Shared player link: <a href="'+escapeHtml(url)+'" target="_blank" rel="noopener">'+escapeHtml(url)+'</a> <button class="button quiet" data-action="copy">Copy link</button></p>'+controls+'<h3>Investigator roster</h3>'+roster+'<h3>Evidence release board</h3>'+clues+solution;
    $('host-dashboard').onclick=function(ev){var a=ev.target.dataset.action;if(a==='phase'){if(phaseNext==='REVEAL'&&!confirm('Reveal the solution to everyone?'))return;hostAction('transitionGame',[hostToken,phaseNext],true);}else if(a==='clue')hostAction('releaseNextClue',[hostToken],true);else if(a==='new'){if(confirm('Start a fresh game? The current lobby and ballots will be cleared. Completed results are saved.'))hostAction('createGame',[hostToken,Number($('limit-select').value)],true);}else if(a==='registration')hostAction('hostSetSettings',[hostToken,{registrationOpen:!d.registrationOpen}],true);else if(a==='save-settings')hostAction('hostSetSettings',[hostToken,{playerLimit:Number($('limit-select').value),durationSeconds:Number($('duration-select').value),allowVoteChanges:$('vote-changes').checked}],true);else if(a==='copy')navigator.clipboard.writeText(url).then(function(){alert('Shared link copied.');});else if(a==='presentation')window.open(url+'?presentation=1','_blank','noopener');else if(a==='logout'){sessionStorage.removeItem(hostKey);hostToken='';$('host-dashboard').classList.add('hidden');$('host-login').classList.remove('hidden');}var id=ev.target.dataset.remove;if(id&&confirm('Remove this player and revoke their private session?'))hostAction('revokePlayer',[hostToken,id],true);};
  }
  if(hostToken)loadHost();poll();window.setInterval(updateTimer,1000);
})();
</script>
