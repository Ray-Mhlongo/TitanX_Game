<script>

  function renderHost(d){$('host-login').classList.add('hidden');$('host-dashboard').classList.remove('hidden');var phaseNext=nextPhase[d.phase];var url=d.publicUrl||window.location.href.split('?')[0];

    var clues='<div class="host-note-list">'+(d.evidence||[]).map(function(e){return '<p><b>'+(e.released?'Released':'Pending')+' '+escapeHtml(e.title)+'</b> · '+escapeHtml(e.hostNote)+'</p>';}).join('')+'</div>';

    $('host-dashboard').onclick=function(ev){var a=ev.target.dataset.action;if(a==='reveal-solution'){if(confirm('Reveal the killer and full solution to everyone?'))hostAction('hostVotingAction',[hostToken,'revealSolution',{}],true);}else if(a==='open-voting'){var selectedDuration=document.getElementById('vote-duration').value,seconds=selectedDuration==='custom'?Number(document.getElementById('custom-duration').value):Number(selectedDuration);hostAction('hostVotingAction',[hostToken,Number(d.votingRound)>0?'next':'open',{durationSeconds:seconds,autoClose:document.getElementById('auto-close').checked}],true);}else if(a==='close-voting')hostAction('hostVotingAction',[hostToken,'close',{}],true);else if(a==='extend-voting')hostAction('hostVotingAction',[hostToken,'extend',{durationSeconds:30}],true);else if(a==='reveal-results')hostAction('hostVotingAction',[hostToken,'reveal',{}],true);else if(a==='reopen-voting')hostAction('hostVotingAction',[hostToken,'reopen',{durationSeconds:60,autoClose:true}],true);else if(a==='skip-round')hostAction('hostVotingAction',[hostToken,'skip',{}],true);else if(a==='runoff'){var totals=d.voteTotals||{},keys=Object.keys(totals),max=keys.reduce(function(m,k){return Math.max(m,Number(totals[k]));},0),tied=keys.filter(function(k){return Number(totals[k])===max&&max>0;});hostAction('hostVotingAction',[hostToken,'runoff',{characterIds:tied,durationSeconds:60,autoClose:true}],true);}else if(a==='confirm-elimination'){var who=(d.characters||[]).filter(function(c){return c.id===ev.target.dataset.character;})[0];if(who&&confirm('Confirm elimination of '+who.name+'?'))hostAction('hostVotingAction',[hostToken,'eliminate',{characterId:who.id}],true);}else if(a==='phase'){hostAction('transitionGame',[hostToken,phaseNext],true);}else if(a==='clue')hostAction('releaseNextClue',[hostToken],true);else if(a==='new'){if(confirm('Start a fresh game? The current lobby and ballots will be cleared. Completed results are saved.'))hostAction('createGame',[hostT
